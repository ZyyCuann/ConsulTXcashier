<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Kasir Putraguci</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: kerja kasir = katalog | keranjang (scroll terpisah); laporan = satu scroll halaman.
   Peran warna: purple = aksi utama & pilihan aktif, peach = latar pendukung, coral = perhatian,
   pink = penekanan data selektif, ink = teks & panel gelap netral. */
:root{
  /* palet merek */
  --peach:#FFC994;--coral:#FF766F;--pink:#E0307A;--purple:#8540DD;
  /* turunan untuk keterbacaan (dicek kontrasnya) */
  --purple-d:#6A2FB8;--purple-t:#F1E7FC;--pink-t:#FCE1EC;--pink-x:#A81C59;--coral-t:#FFE1DF;--coral-x:#A8322C;--peach-t:#FFE9D2;
  /* netral */
  --ink:#3B1A5C;--ink-2:#533077;--muted:#6B5A7A;--on-dark:#E6D8F5;
  --bg:#FFF6EC;--surface:#FFFFFF;--line:#F3DFCB;--control:#9C7A5E;
  /* spacing */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--page:24px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --hdr:64px;--nav:0px;--cartbar:0px;
  --ui:Poppins,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.num,td,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.r{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- kerangka ---------- */
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.hdr{height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(var(--page),env(safe-area-inset-right,0px)) 0 max(var(--page),env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2)}
.logo{width:44px;height:44px;border-radius:var(--r-md);border:0;background:var(--purple);color:#fff;font-weight:700;font-size:15px;flex:none;margin-right:var(--s3)}
.logo.on{box-shadow:0 0 0 3px var(--peach)}
.title-m{display:none;font-weight:700;font-size:17px}
.tabs{display:flex;gap:var(--s1)}
.tab{min-height:44px;padding:0 var(--s4);border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab.on{background:var(--purple);color:#fff;font-weight:600}
.tab svg{flex:none}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:var(--s3);flex:none}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock b{font-size:17px;font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:0;line-height:1.2}
.chip.warn{background:var(--coral-t);color:var(--coral-x)}
.chip.ok{background:var(--pink-t);color:var(--pink-x)}
.chip.info{background:var(--purple-t);color:var(--purple-d)}
.chip.mute{background:var(--bg);color:var(--muted)}
button.chip{min-height:36px}
.strip{display:flex;align-items:center;gap:var(--s4);min-height:36px;padding:var(--s1) var(--page);background:var(--purple-t);color:var(--purple-d);font-size:13px;border:0;width:100%;text-align:left}
.strip b{font-weight:600}
.strip .go{margin-left:auto;font-weight:600;white-space:nowrap}
main{min-height:0;position:relative}
.page{height:100%;overflow-y:auto;padding:var(--page) max(var(--page),env(safe-area-inset-right,0px)) calc(var(--page) + var(--nav) + var(--cartbar)) max(var(--page),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--s5)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);gap:var(--s5);align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols.side{grid-template-columns:minmax(300px,2fr) minmax(0,3fr)}
.stack{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.panel.dark{background:var(--ink);color:#fff}
.panel.dark .muted,.panel.dark .label{color:var(--on-dark)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.main{background:var(--purple);color:#fff}.kpi.main .label,.kpi.main .muted{color:#fff}
.kpi.dark{background:var(--ink);color:#fff}.kpi.dark .label,.kpi.dark .muted{color:var(--on-dark)}
.btn{min-height:48px;padding:0 var(--s5);border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);color:var(--ink);text-align:center;line-height:1.2}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--purple-d)}
.btn.warn{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--purple-d)}
.btn.ondark{background:transparent;border-color:var(--on-dark);color:#fff}
.btn.big{min-height:56px;font-size:17px}
.btn.sm{min-height:40px;padding:0 var(--s4);font-size:14px}
.btn:disabled{background:#EFE7EE;border-color:#EFE7EE;color:#6E6175}
.seg{display:flex;gap:var(--s1);background:var(--bg);padding:var(--s1);border-radius:var(--r-md);border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:0;border-radius:var(--r-sm);background:transparent;font-size:14px;font-weight:500;padding:0 var(--s3);white-space:nowrap}
.seg button.on{background:var(--purple);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp,.field input,.field select{min-height:48px;border-radius:var(--r-md);border:1px solid var(--control);padding:0 14px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:400;width:100%}
.inp::placeholder,.field input::placeholder{color:#8E7F99}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);text-align:center;color:var(--muted);padding:var(--s6) var(--s4)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
.note.warn{background:var(--coral-t);color:var(--coral-x)}

/* ---------- kasir ---------- */
.kasir{height:100%;display:grid;grid-template-columns:104px minmax(0,1fr) 380px;position:relative}
.kat{background:var(--surface);border-right:1px solid var(--line);padding:var(--s3) var(--s2);display:flex;flex-direction:column;gap:var(--s2);overflow-y:auto}
.kat button{min-height:64px;border-radius:var(--r-md);border:0;background:transparent;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s2);color:var(--ink)}
.kat button span{font-size:12px;font-weight:500;color:var(--muted)}
.kat button:hover{background:var(--bg)}
.kat button.on{background:var(--purple);color:#fff}.kat button.on span{color:#fff}
.catalog{min-height:0;overflow-y:auto;padding:var(--s4) var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.cat-h{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.cari{display:flex;align-items:center;gap:var(--s2);min-height:44px;background:var(--surface);border:1px solid var(--control);border-radius:999px;padding:0 var(--s4);flex:1;min-width:200px;max-width:360px;margin-left:auto}
.cari input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:15px}
.cari:focus-within{outline:3px solid var(--purple);outline-offset:1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.mcard{border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-height:148px}
.mcard:hover{border-color:var(--control)}
.mcard.on{border:2px solid var(--purple)}
.mcard .pic{height:72px;flex:none;display:flex;justify-content:space-between;align-items:flex-start;padding:var(--s2);background:var(--peach-t) center/cover no-repeat;position:relative}
.mcard .ini{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 var(--s3) 6px;font-size:22px;font-weight:700;color:rgba(59,26,92,.35)}
.mcard .tag{position:relative;font-size:11px;font-weight:600;background:#fff;border-radius:999px;padding:2px 8px;color:var(--pink-x)}
.mcard .tag.warn{color:var(--coral-x)}
.mcard .q{position:relative;margin-left:auto;font-size:13px;font-weight:700;color:#fff;background:var(--purple);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.mcard .info{padding:var(--s2) var(--s3) var(--s3);display:flex;flex-direction:column;gap:2px;flex:1}
.mcard .nm{font-size:14px;font-weight:600;line-height:1.3}
.mcard .hg{font-size:14px;font-weight:600;color:var(--purple-d);margin-top:auto;font-variant-numeric:tabular-nums}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:var(--s4) var(--s5) var(--s3);display:flex;flex-direction:column;gap:var(--s3);border-bottom:1px solid var(--line)}
.cart-close{display:none}
.cart-b{flex:1;min-height:0;overflow-y:auto;padding:0 var(--s5)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.crow .nm b{font-weight:600;font-size:14px}
.stepper{display:flex;align-items:center;gap:var(--s1)}
.qb{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--control);background:var(--surface);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.qb.p{background:var(--purple);border-color:var(--purple);color:#fff}
.stepper b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.cart-f{padding:var(--s4) var(--s5) calc(var(--s4) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s3);background:var(--surface)}
.paybtn{min-height:60px;border-radius:var(--r-md);border:0;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s5);font-weight:600;font-size:17px}
.paybtn b{font-size:22px;font-variant-numeric:tabular-nums}
.paybtn:disabled{background:#EFE7EE;color:#6E6175}
.cartbar{display:none}
.closed{position:absolute;inset:0;background:rgba(59,26,92,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);text-align:center;padding:var(--s5);z-index:5}

/* ---------- bayar ---------- */
.bill{display:flex;flex-direction:column}
.bill-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.qbox{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--peach-t);font-variant-numeric:tabular-nums}
.total-bar{border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff}
.total-bar b{font-size:30px;font-variant-numeric:tabular-nums}
.paygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5)}
.recv{border:2px solid var(--purple);border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;flex-direction:column}
.recv b{font-size:30px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.quick button{min-height:48px;border-radius:var(--r-sm);border:1px solid var(--control);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.quick button.on{border:2px solid var(--purple);background:var(--purple-t);color:var(--purple-d)}
.change{background:var(--pink-t);color:var(--pink-x);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s1)}
.change b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.change.bad{background:var(--coral-t);color:var(--coral-x)}
.change.idle{background:var(--bg);color:var(--muted)}
.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:60px;gap:var(--s2)}
.numpad button{border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600}
.numpad button:active{background:var(--peach-t)}
.ck{display:flex;align-items:center;gap:var(--s3);min-height:52px;font-size:15px;cursor:pointer;padding:var(--s1) 0}
.ck input{width:24px;height:24px;accent-color:var(--purple);flex:none}
.payfoot{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:var(--s4)}
.payfoot .msg-err{flex:1;min-width:180px;font-size:14px;font-weight:600;color:var(--coral-x);display:flex;gap:6px;align-items:center}
.payfoot .msg-ok{flex:1;min-width:180px;font-size:14px;font-weight:600;color:var(--pink-x)}

/* ---------- resi ---------- */
.paper{background:#fff;color:#1d1029;width:100%;max-width:320px;margin:0 auto;padding:var(--s5) var(--s4);border-radius:4px;font:12px/1.5 var(--mono);white-space:pre;overflow-x:auto;border:1px solid var(--line)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.opt{min-height:96px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);padding:var(--s4);text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px var(--s3);align-items:center}
.opt .ic{grid-row:span 2;width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--bg);color:var(--ink)}
.opt.on{border:2px solid var(--purple);background:var(--purple-t)}
.opt.on .ic{background:var(--purple);color:#fff}
.opt b{font-size:15px}

/* ---------- grafik & tabel ---------- */
.chart{display:flex;flex-direction:column;gap:var(--s2)}
.bars{height:220px;display:flex;align-items:flex-end;gap:var(--s2);border-bottom:1px solid var(--control);position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:var(--s1);height:100%;min-width:0}
.bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px;background:var(--peach)}
.bars .b span{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bars.dense{gap:3px;height:200px}
.avg{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.avg span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:600;background:var(--surface);padding:0 4px;color:var(--muted)}
.axis{display:flex;gap:var(--s2)}.axis span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.split{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bg)}
.split i{display:block;height:100%}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:var(--s2) var(--s2);border-bottom:1px solid var(--control);white-space:nowrap}
table.data td{padding:10px var(--s2);border-bottom:1px solid var(--line);vertical-align:middle}
table.data th.r,table.data td.r{text-align:right}
table.data tbody tr:last-child td{border-bottom:0}
.rk-no{width:32px;color:var(--muted);font-weight:600}
.rk-bar{display:flex;align-items:center;gap:var(--s2);min-width:120px}
.rk-bar i{display:block;height:12px;border-radius:3px;background:var(--purple);flex:none}
.rk-bar b{font-size:13px;font-variant-numeric:tabular-nums;min-width:28px}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.quad>div{border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;min-height:120px;background:var(--bg)}
.quad .qt{font-size:14px;font-weight:700}
.quad .ls{margin-top:var(--s2);font-size:14px;font-weight:500;line-height:1.4}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s3);align-items:start;border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:14px;line-height:1.45;background:var(--bg)}
.msg .ic{width:28px;height:28px;border-radius:999px;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}

/* riwayat */
.tlist{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:64px 52px minmax(0,1fr) 80px 112px 96px;gap:var(--s3);align-items:center;padding:10px var(--s3);border-radius:var(--r-sm);font-size:14px;border:0;background:transparent;text-align:left;width:100%;min-height:52px}
.tr.h{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--control);border-radius:0;min-height:36px}
.tr:not(.h):hover{background:var(--bg)}
.tr.on{background:var(--purple-t);box-shadow:inset 3px 0 0 var(--purple)}
.tr.batal .isi,.tr.batal .tot{text-decoration:line-through;color:var(--muted)}
.tr .isi{line-height:1.35}
.tr .meta{display:none}
.sticky{position:sticky;top:0}

/* profil */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3)}
.tile{min-height:64px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;text-align:left}
.tile:hover{border-color:var(--control)}
.tile.on{background:var(--purple-t);border:2px solid var(--purple)}
.tile .ic{flex:none;width:40px;height:40px;border-radius:var(--r-sm);font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-size:14px}
.tile.on .ic{background:var(--purple);color:#fff}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3)}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) 112px 112px 60px;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.mrow.h{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--control)}
.mrow .inp{min-height:44px;font-size:15px}
.thumb{width:52px;height:40px;border-radius:var(--r-sm);border:1px dashed var(--control);background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center}
.linkbtn{border:0;background:none;padding:2px;font-size:12px;color:var(--coral-x);text-decoration:underline;min-height:24px}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:#CDB9A7;position:relative}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.switch.on{background:var(--purple)}.switch.on::after{left:24px}

/* modal, sheet, toast */
.modal{position:fixed;inset:0;background:rgba(59,26,92,.55);display:flex;align-items:center;justify-content:center;padding:var(--s4);z-index:50}
.modal .box{background:var(--surface);border-radius:20px;padding:var(--s5);width:460px;max-width:100%;display:flex;flex-direction:column;gap:var(--s4);max-height:calc(100% - 32px);overflow-y:auto}
.modal .box.wide{width:560px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--nav) + var(--cartbar) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:var(--s3) var(--s5);border-radius:var(--r-md);font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.bnav{display:none}

#print{display:none}
@media print{
  @page{size:58mm auto;margin:0}
  body{background:#fff}
  .app,.modal,.toast,.bnav,.cartbar{display:none!important}
  #print{display:block;font:11px/1.35 var(--mono);color:#000;width:58mm;padding:2mm}
  #print pre{margin:0 0 6mm;white-space:pre-wrap;font:inherit}
  #print pre+pre{page-break-before:always}
}

/* ---------- responsive (berdasarkan titik rusaknya isi) ---------- */
/* <1180: rail kategori jadi baris chip; keranjang sedikit lebih sempit */
@media (max-width:1179px){
  .kasir{grid-template-columns:minmax(0,1fr) 340px}
  .kat{grid-column:1/-1;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--page);overflow-x:auto;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
  .kat::-webkit-scrollbar{display:none}
  .kat button{flex:none;min-height:44px;flex-direction:row;gap:6px;padding:0 var(--s4);border:1px solid var(--line);border-radius:999px}
  .kasir{grid-template-rows:auto minmax(0,1fr)}
  .catalog{padding:var(--s4)}
}
/* <1100: laporan jadi satu kolom */
@media (max-width:1099px){
  :root{--page:20px}
  .cols,.cols.even,.cols.side{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k3 .kpi.dark{grid-column:1/-1}
  .sticky{position:static}
  .rw-detail{display:none}
  .order-first{order:-1}
}
/* <860: satu area kerja, navigasi bawah, keranjang jadi bar + lembar */
@media (max-width:859px){
  :root{--page:16px;--hdr:56px;--nav:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabs{display:none}.title-m{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-r{gap:var(--s2)}.hdr-r .chip{padding:2px 8px;font-size:11px}
  .hdr .hide-m{display:none}
  .clock span{display:none}
  .logo{width:40px;height:40px;margin-right:var(--s2)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:var(--nav);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);min-height:48px}
  .bnav button.on{color:var(--purple-d);font-weight:700}
  .bnav button.on svg{stroke:var(--purple)}
  body.focus .bnav{display:none}
  body.focus{--nav:0px}
  .strip{display:none}
  .kasir{grid-template-columns:minmax(0,1fr)}
  .catalog{padding-bottom:calc(var(--s4) + var(--nav) + var(--cartbar))}
  .cart{position:fixed;inset:0;z-index:45;border-left:0;transform:translateY(100%);transition:transform .2s ease;visibility:hidden}
  .cart.open{transform:none;visibility:visible}
  .cart-close{display:inline-flex}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:var(--nav);z-index:31;padding:var(--s2) var(--page);background:transparent}
  .cartbar button{flex:1;min-height:56px;border:0;border-radius:var(--r-md);background:var(--purple);color:#fff;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(59,26,92,.25)}
  .cartbar b{margin-left:auto;font-size:17px;font-variant-numeric:tabular-nums}
  body.hascart{--cartbar:72px}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm nm" "st tot";row-gap:var(--s2)}
  .crow>.nm{grid-area:nm}.crow>.stepper{grid-area:st}.crow>b{grid-area:tot}
  .paygrid{grid-template-columns:minmax(0,1fr)}
  .numpad{grid-auto-rows:52px}
  .tr.h{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"no tot" "isi isi" "meta meta";gap:2px var(--s3);padding:var(--s3);border-bottom:1px solid var(--line);border-radius:0}
  .tr>.c-no{grid-area:no}.tr>.tot{grid-area:tot}.tr>.isi{grid-area:isi;font-size:13px;color:var(--muted)}
  .tr>.c-jam,.tr>.c-bayar,.tr>.c-resi{display:none}
  .tr .meta{grid-area:meta;display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:4px}
  .mrow{grid-template-columns:52px minmax(0,1fr) 60px;grid-template-areas:"f n s" "f h m"}
  .mrow.h{display:none}
  .mrow>:nth-child(1){grid-area:f}.mrow>:nth-child(2){grid-area:n}.mrow>:nth-child(3){grid-area:h}.mrow>:nth-child(4){grid-area:m}.mrow>:nth-child(5){grid-area:s;justify-self:end}
  .mrow{grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 60px;grid-template-areas:"f n n s" "f h m m"}
  .hdr-r .chip.warn span{display:none}
}
@media (max-width:599px){
  .opts{grid-template-columns:minmax(0,1fr)}
  table.rank thead{display:none}
  table.rank,table.rank tbody{display:block}
  table.rank tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"no nm tot" "no bar upp";gap:2px var(--s2);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
  table.rank td{border:0;padding:0}
  table.rank td.rk-no{grid-area:no}table.rank td.rk-nm{grid-area:nm}table.rank td.rk-p{grid-area:bar}table.rank td.rk-u{grid-area:upp;font-size:12px;color:var(--muted)}table.rank td.rk-t{grid-area:tot;font-weight:700}
  table.rank td.rk-q{display:none}
  table.rank .rk-u::before{content:"per porsi "}
  .kpi .v{font-size:24px}
  .quad>div{min-height:96px}
  .cari{min-width:0;max-width:none;flex-basis:100%}
}
@media (hover:none){.tab:hover,.btn:hover:not(:disabled),.kat button:hover{background:inherit}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* scroll internal yang tipis: hanya pada katalog & keranjang, tidak global */
@media (hover:hover) and (pointer:fine){
  .catalog,.cart-b{scrollbar-width:thin;scrollbar-color:#D9C2AE transparent;scrollbar-gutter:stable}
}
